# Extrai o texto das partituras e das páginas dos livros (camada de texto do PDF ou OCR), para a pesquisa e a
# identificação pelo som. Só trata o que é novo; a primeira vez leva várias corridas (pára aos 70 min e continua na
# seguinte). Corre todos os dias e a pedido. Sem segredos: identifica-se à função pdf-texto com o token OIDC do GitHub.
name: Texto dos PDF
on:
  schedule:
    - cron: '20 7 * * *'   # todos os dias, 07:20 UTC (depois da conversão das gravações)
  workflow_dispatch:
    inputs:
      minutos:
        description: 'Minutos de extração nesta corrida (máximo 70)'
        default: '70'
permissions:
  contents: read
  id-token: write
concurrency:
  group: texto-pdf
  cancel-in-progress: false
jobs:
  texto:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Instalar poppler e tesseract
        timeout-minutes: 10
        # 3 tentativas, 30 s entre elas (como em «Converter gravações»)
        run: |
          for n in 1 2 3; do
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq \
              && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y -qq \
                 poppler-utils tesseract-ocr tesseract-ocr-por tesseract-ocr-ita tesseract-ocr-spa tesseract-ocr-fra tesseract-ocr-lat \
              && exit 0
            echo "Tentativa $n falhou; nova tentativa em 30 s"; sleep 30
          done
          exit 1
      - name: Extrair texto
        env:
          MINUTOS: ${{ inputs.minutos || '70' }}
        run: node tools/pdf/texto.mjs
