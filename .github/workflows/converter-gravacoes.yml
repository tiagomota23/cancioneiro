# Converte para AAC (.m4a) as gravações em formatos que nem todos os telemóveis tocam (ex.: .ogg do WhatsApp).
# Corre todos os dias e a pedido. Sem segredos: identifica-se à função gravacoes do Supabase com o token OIDC do GitHub.
name: Converter gravações
on:
  schedule:
    - cron: '45 6 * * *'   # todos os dias, 06:45 UTC
  workflow_dispatch: {}
permissions:
  contents: read
  id-token: write
jobs:
  converter:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # a falha de 11 nov (DNS do Ubuntu) ficou 1 h presa antes de falhar
    steps:
      - uses: actions/checkout@v4
      - name: Instalar ffmpeg
        timeout-minutes: 10
        # 3 tentativas, 30 s entre elas; o apt também repete cada ficheiro e desiste de cada pedido ao fim de 30 s
        run: |
          for n in 1 2 3; do
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq \
              && sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y -qq ffmpeg \
              && exit 0
            echo "Tentativa $n falhou; nova tentativa em 30 s"; sleep 30
          done
          exit 1
      - name: Converter
        run: node tools/audio/convert.mjs
