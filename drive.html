<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-v6jrPY2uaqbkHRZhQZZHwm5sGNGPAsumVJ2pV72kfmU='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#10835c">
  <title>Cancioneiro · Drive do Coro</title>
  <link rel="icon" href="icons/icon-192.png">
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      font-family: var(--sans); color: var(--text);
      background: linear-gradient(180deg, var(--brand), var(--brand-deep)); }
    .card { width: 100%; max-width: 440px; background: var(--surface); border-radius: 16px; padding: 26px 22px; box-shadow: 0 8px 30px color-mix(in srgb, var(--shadow) 18%, transparent); text-align: center; }
    h1 { font-family: var(--serif); font-weight: 400; letter-spacing: .14em; color: var(--brand-deep); font-size: 22px; margin: 0 0 18px; }
    h2 { font-size: 18px; margin: 0 0 10px; }
    p { line-height: 1.5; color: var(--text-soft); margin: 8px 0; }
  </style>
</head>
<body>
  <main class="card">
    <h1>CANCIONEIRO</h1>
    <h2 id="t"></h2>
    <p id="m"></p>
  </main>
  <script>
if (window.top !== window.self) { document.documentElement.style.display = 'none'; try { window.top.location = window.location.href; } catch (e) {} throw new Error('framed'); } // não pode ser mostrado dentro de outra página
    // Página de resultado da ligação ao Google Drive (função drive-auth); o texto vem no endereço e é mostrado como texto simples
    const q = new URLSearchParams(location.search);
    document.getElementById('t').textContent = q.get('t') || 'Drive do Coro';
    document.getElementById('m').textContent = q.get('m') || '';
  </script>
</body>
</html>
