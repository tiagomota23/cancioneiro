# Converte para AAC (.m4a) as gravações em formatos que nem todos os telemóveis tocam (ex.: .ogg do WhatsApp).
# Corre todos os dias (depois da verificação do Drive às segundas) e a pedido. Precisa do segredo SUPABASE_SERVICE_ROLE_KEY.
name: Converter gravações
on:
  schedule:
    - cron: '45 6 * * *'   # todos os dias, 06:45 UTC
  workflow_dispatch: {}
jobs:
  converter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Converter
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node tools/audio/convert.mjs
