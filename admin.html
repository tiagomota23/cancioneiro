<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-/CSEDuhOYHXbUInWRvy5to6rChkMirwe602CfHMbUg8='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self'; connect-src https://hmfjbyiesghqhwhqgnem.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#1ab07f">
  <title>Cancioneiro · Pedido de acesso</title>
  <link rel="icon" href="icons/icon-192.png">
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="theme.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      font-family: var(--sans); color: var(--text);
      background: linear-gradient(180deg, var(--brand), var(--brand-deep)); }
    .card { width: 100%; max-width: 440px; background: var(--surface); border-radius: 16px; padding: 26px 22px; box-shadow: 0 8px 30px color-mix(in srgb, var(--shadow) 18%, transparent); text-align: center; }
    h1 { font-family: var(--serif); font-weight: 400; letter-spacing: .14em; color: var(--brand-deep); font-size: 22px; margin: 0 0 18px; }
    .who { background: var(--tint-soft); border: 1px solid var(--card-border); border-radius: 12px; padding: 14px; margin: 14px 0 18px; }
    .who b { display: block; font-size: 17px; }
    .who span { color: var(--text-muted); overflow-wrap: anywhere; }
    p { line-height: 1.5; margin: 8px 0; }
    button { font: 700 16px var(--sans); border: 0; border-radius: 24px; padding: 13px 26px; color: var(--on-accent); cursor: pointer; width: 100%; margin-top: 6px; }
    button.ok { background: var(--light-accent); }
    button.no { background: var(--danger); }
    button:disabled { opacity: .5; }
    select { font: 16px var(--sans); width: 100%; padding: 11px 12px; border: 1px solid var(--field-border); border-radius: 12px; background: var(--surface); color: var(--text); margin: 4px 0 8px; }
    .msg { font-size: 15px; }
    .small { color: var(--text-faint); font-size: 13px; }
    a { color: var(--light-accent); }
  </style>
</head>
<body>
  <main class="card">
    <h1>CANCIONEIRO</h1>
    <div id="out"><p class="small">A carregar…</p></div>
  </main>
  <script src="config.js?v=25"></script>
  <script>
if (window.top !== window.self) { document.documentElement.style.display = 'none'; try { window.top.location = window.location.href; } catch (e) {} throw new Error('framed'); } // não pode ser mostrado dentro de outra página
  (async () => {
    const out = document.getElementById('out');
    const q = new URLSearchParams(location.search);
    const id = q.get('id'), token = q.get('t'), action = q.get('a');
    const PERFIS = { cancioneiro: '○ Cancioneiro', coro: 'Ⓒ Coro', maestro: 'Ⓜ Maestro', gestor: '● Gestor' };
    const role = PERFIS[q.get('r')] ? q.get('r') : 'cancioneiro';
    const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const { SUPABASE_URL, SUPABASE_ANON_KEY } = window.CANCIONEIRO_CONFIG;
    const call = async body => {
      const r = await fetch(SUPABASE_URL + '/functions/v1/notify', { method: 'POST',
        headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify(body) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok || d.error) throw new Error(d.error || ('HTTP ' + r.status));
      return d;
    };
    const who = d => `<div class="who"><b>${esc(d.name || '(sem nome)')}</b><span>${esc(d.email)}</span>${d.invited_by ? `<span>Convidado por <b>${esc(d.invited_by)}</b> para o perfil <b>${esc(({ cancioneiro: 'Cancioneiro', coro: 'Coro', maestro: 'Maestro', gestor: 'Gestor' })[d.invited_role] || d.invited_role || '')}</b></span>` : ''}</div>`;
    const done = d => d.status === 'autorizado'
      ? `<p class="msg">✅ <b>Acesso autorizado${d.role ? ' — perfil ' + esc(PERFIS[d.role]) : ''}.</b></p><p class="small">Na próxima vez que entrar com o Google, esta pessoa verá os cânticos.</p>`
      : `<p class="msg">⛔ <b>Acesso bloqueado.</b></p><p class="small">Esta conta já não consegue entrar no Cancioneiro.</p>`;
    if (!id || !token || !['autorizar', 'bloquear'].includes(action)) { out.innerHTML = '<p>Link inválido.</p>'; return; }
    try {
      const d = await call({ type: 'peek', id, token });
      if (d.status !== 'pendente') { out.innerHTML = who(d) + '<p class="small">Este pedido já foi decidido.</p>' + done(d); return; }
      const allow = action === 'autorizar';
      out.innerHTML = who(d) +
        (allow
          ? `<p>Autorizar esta pessoa a usar o Cancioneiro com o perfil:</p><select id="role">${Object.entries(PERFIS).map(([k, v]) => `<option value="${k}"${k === role ? ' selected' : ''}>${esc(v)}</option>`).join('')}</select>`
          : `<p>Bloquear esta pessoa? Deixará de conseguir entrar.</p>`) +
        `<button id="go" class="${allow ? 'ok' : 'no'}">${allow ? 'Sim, autorizar' : 'Sim, bloquear'}</button>` +
        `<p class="small" style="margin-top:14px"><a href="?id=${encodeURIComponent(id)}&t=${encodeURIComponent(token)}&a=${allow ? 'bloquear' : 'autorizar'}">${allow ? 'Prefiro bloquear' : 'Prefiro autorizar'}</a></p>`;
      document.getElementById('go').onclick = async e => {
        e.target.disabled = true; e.target.textContent = 'A guardar…';
        try { const r = await call({ type: 'decide', id, token, action, role: allow ? document.getElementById('role').value : undefined }); out.innerHTML = who(r) + done(r); }
        catch (err) { e.target.disabled = false; e.target.textContent = 'Tentar de novo'; out.insertAdjacentHTML('beforeend', `<p class="small">Erro: ${esc(err.message)}</p>`); }
      };
    } catch (err) {
      out.innerHTML = `<p>Não foi possível abrir o pedido.</p><p class="small">${esc(err.message)}</p>`;
    }
  })();
  </script>
</body>
</html>
